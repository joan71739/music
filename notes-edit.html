<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金曲歌王 — 編輯備註</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/notes-edit.css">
</head>

<body>

  <div id="ne-view">

    <!-- 標題列 -->
    <div class="ne-header">
      <a href="index.html" class="ne-back" aria-label="返回首頁">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </a>
      <div class="ne-title">編輯歌曲備註</div>
    </div>

    <!-- 下拉 1：主題歌單 -->
    <div class="ne-field">
      <label class="ne-label" for="ne-playlist">主題歌單</label>
      <div class="ne-select-wrap">
        <select id="ne-playlist" class="ne-select" disabled>
          <option value="">載入中...</option>
        </select>
        <i class="ti ti-chevron-down ne-select-arrow" aria-hidden="true"></i>
      </div>
    </div>

    <!-- 下拉 2：歌曲 -->
    <div class="ne-field">
      <label class="ne-label" for="ne-track">歌曲</label>
      <div class="ne-select-wrap">
        <select id="ne-track" class="ne-select" disabled>
          <option value="">請先選擇歌單</option>
        </select>
        <i class="ti ti-chevron-down ne-select-arrow" aria-hidden="true"></i>
      </div>
    </div>

    <!-- 選好歌曲後出現：備註輸入 -->
    <div id="ne-note-section" style="display:none">
      <div class="ne-track-card">
        <div class="ne-track-icon"><i class="ti ti-music" aria-hidden="true"></i></div>
        <div class="ne-track-info">
          <div class="ne-track-name" id="ne-track-name"></div>
          <div class="ne-track-artist" id="ne-track-artist"></div>
        </div>
      </div>

      <div class="ne-field">
        <label class="ne-label" for="ne-note">備註</label>
        <textarea id="ne-note" class="ne-textarea" rows="3" maxlength="120" disabled
          placeholder="例如：SPY×FAMILY 第2季 OP"></textarea>
      </div>

      <div class="ne-actions">
        <span id="ne-status" class="ne-status"></span>
        <button id="ne-save" class="ne-btn" type="button" onclick="neSave()" disabled>儲存</button>
      </div>
    </div>

    <!-- 全頁錯誤訊息 -->
    <div id="ne-error" class="ne-error" style="display:none"></div>

  </div>

  <!-- Firebase SDK（compat，與 host-wait.html 同版本） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="js/base.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/track-notes.js"></script>
  <script src="js/notes-edit.js"></script>

</body>

</html>
